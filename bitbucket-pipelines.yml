pipelines:
  branches:
    master:
      - step:
          name: Login to aws ecr
          image: amazon/aws-cli
          services:
            - docker
          script:
            # dockerhub login
            - docker login --username $DOCKERHUB_USERNAME --password $DOCKERHUB_PWD
            - cp /root/.docker/config.json .
          artifacts:
            - config.json
